# ==========================================
# GENERAL SETTINGS & OPTIONS
# ==========================================

# Start window and pane numbering at 1 for easier keyboard reaching
set -g base-index 1
set -g pane-base-index 1

# Enable true color (RGB) support
set -sg terminal-overrides ",*:RGB"

# Eliminate delay when pressing the ESC key
set -g escape-time 0

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Increase the time allowed to repeat a command (in ms)
set -g repeat-time 1000

# (Optional) Enable mouse support
# set -g mouse on


# ==========================================
# PREFIX MAPPING
# ==========================================

# Unbind the default Ctrl+b
unbind C-b

# Set the new Prefix to the single quote key (')
set -g prefix "'"
bind "'" send-prefix


# ==========================================
# KEYBINDINGS: NAVIGATION & SIZING
# ==========================================

# Pane Navigation: WASD keys (requires Prefix)
bind w select-pane -U
bind a select-pane -L
bind s select-pane -D
bind d select-pane -R

# Pane Resizing: Shift + WASD (Repeatable)
bind -r W resize-pane -U 5
bind -r A resize-pane -L 5
bind -r S resize-pane -D 5
bind -r D resize-pane -R 5

# Pane Navigation: Alt + WASD (No Prefix needed)
bind -n M-w select-pane -U
bind -n M-a select-pane -L
bind -n M-s select-pane -D
bind -n M-d select-pane -R

# Standard Arrow keys
bind Up select-pane -U
bind Left select-pane -L
bind Down select-pane -D
bind Right select-pane -R


# ==========================================
# KEYBINDINGS: WINDOWS & PANES
# ==========================================

# Splitting Panes: 'h' or '|' for horizontal, 'v' or '-' for vertical
bind h split-window -h
bind | split-window -h
bind v split-window -v
bind - split-window -v

# Window Navigation: Ctrl+Tab and Ctrl+Shift+Tab
bind -n C-Tab next-window
bind -n C-S-Tab previous-window

# Quick Window Jump: Alt + 1-9
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# Utility Bindings
bind f resize-pane -Z             # Toggle Fullscreen (Zoom)
bind -n M-f resize-pane -Z        # Toggle Zoom with Alt+F
bind q detach-client              # Detach from session
bind e choose-window -Z           # Interactive window selector

# NEW: Reload configuration (Prefix + r)
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"


# ==========================================
# THEME & UI CUSTOMIZATION
# ==========================================

set -g pane-border-lines simple
set -g pane-border-style fg=black,bright
set -g pane-active-border-style fg=magenta

set -g status-style bg=default,fg=black,bright
set -g status-left ""
set -g status-right "#[fg=black,bright]#S"

set -g window-status-format "●"
set -g window-status-current-format "●"

set -g window-status-current-style "#{?window_zoomed_flag,fg=yellow,fg=magenta,nobold}"
set -g window-status-bell-style "fg=red,nobold"


# ==========================================
# PLUGINS (TPM)
# ==========================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-autoreload'
set -g @plugin 'tmux-fzf'           # Fixed spelling from @plutin
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-ressurect'     # Fixed spelling from @plutin
set -g @plugin 'tmux-continuum'      # Fixed spelling from @plutin

# Initialize TMUX plugin manager (MUST be at the very bottom)
run '~/.tmux/plugins/tpm/tpm'